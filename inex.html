<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub e Midias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Hub de Midias</h1>
        <p>Gerenciador de jogos, filme e séries</p>
    </header>
    <main class="container">
        <section clas="painel_cadastro">
            <h2>Adicionar a lista de Midia</h2>
            <for action=""id="form_midia">
                <input type="text" id="titulo" placeholder="Ex: Mortal Kombat"required>
                <select id="categoria" required>
                    <option value="categoria">categoria</option>
                    <option value="Jogos">Jogos</option>
                    <option value="Filmes"></option>
                    <option value="Séries"></option>
                 </select>
                    <input type="text" id="" placeholder="">
                    <input type="button" id="" min=""required>
                    max="" placeholder=""required
            </for>
        </section>
        <section class="painel.catalogo">
            <div class="filtros">
                <button>Todos</button>
                <button>Jogos</button>
                <button>Séries</button>
                <button>Filmes</button>
            </div>
            <div id="catalogo-grid" class="grid">
                <!--Os card serão exibidos aqui-->
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
